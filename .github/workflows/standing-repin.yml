# Standing repin for a SITE, as ONE reusable workflow (issue #401; owner,
# 2026-10-16: pins stay decentralized, each site keeps its own lock, with
# STANDING CONSENT).
#
# A site declares, on an upstream instance in its `index.config.json`,
#
#   "trust": { "consent": {...}, "standing": { "follows": "main", "consentBy": "<who>", "consentAt": "YYYY-MM-DD", "require": "green" } }
#
# and this workflow keeps that pin on the newest (green) commit of `main`,
# writing the rule's consent, by name, for every pin it moves
# (`scripts/repin-standing.ts`; the rule is cat-harness's `schemas/kg/mount-trust.ts`).
#
# A caller (in the site, e.g. `.github/workflows/standing-repin.yml`):
#
#   name: Standing repin
#   on:
#     schedule: [{ cron: "17 */6 * * *" }]          # every six hours
#     repository_dispatch: { types: [upstream-merged] } # an upstream's post-merge step may poke it
#     workflow_dispatch: { inputs: { dry_run: { type: boolean, default: false } } }
#   permissions: { contents: write, pull-requests: write }
#   jobs:
#     repin:
#       uses: litlfred/cat-harness-tools/.github/workflows/standing-repin.yml@main
#       with: { dry-run: ${{ inputs.dry_run == true }} }
#       # secrets: { repin-token: ${{ secrets.REPIN_TOKEN }} }   # see "Why a token" below
#
# An upstream pokes a site with
#   gh api repos/<site>/dispatches -f event_type=upstream-merged
#
# What it does:
#   1. Check out the caller (the site) at its default branch, into `site`.
#   2. Compose the tools at `tools-ref` beside each other in `tools/`
#      (bootstrap-tools, cat-harness, cat-harness-tools, as one workspace), so
#      the repin runs the CURRENT tool and schema, not whatever the site pins.
#   3. Run `repin-standing.ts --instance site`. It resolves each followed
#      branch through the GitHub API, moves only the pins a standing consent
#      covers (`seedRemote`, the `mount:remote --seed` write), re-mounts so
#      `index.lock.json` follows (`mountRemote`), and re-renders the agent
#      surface when the lock changed.
#   4. When a tracked file changed, push `repin/standing-<date>` and open ONE
#      PR, or update the one already open (any `repin/standing-*` head), so
#      runs never stack PRs. What happens to the PR then depends on what
#      started the run (see "Who merges" below):
#        - `workflow_dispatch` (the merge manager started it): auto-merge;
#        - `schedule` or `repository_dispatch` (nobody decided): the
#          `needs-repin` label, and NO auto-merge. An auto-merge already on
#          the PR is turned off, since its content just changed under it.
#
# Why a token: pushes and PRs made with the default GITHUB_TOKEN do not
# trigger the site's own `pull_request` workflows, so required checks never
# run and auto-merge waits forever. Pass `repin-token` (an App or fine-grained
# token with contents + pull-requests write) for checks to run on the repin PR;
# without it the PR is still opened, and the step summary says so.
#
# Who merges (owner, 2026-11-13; cat-harness#1313, merge-manager-watcher
# §"What this does not do yet"): ONLY the merge manager runs a merge path.
# The owner's card the same day, "Standing re-pin workflows: MM dispatches,
# auto-merge OK", decides how that applies here:
#   - a `workflow_dispatch` run is the merge manager's: it started the run,
#     so the PR gets auto-merge;
#   - a `schedule` or `repository_dispatch` run is nobody's decision: it
#     opens or updates the PR and labels it `needs-repin`, and does NOT ask
#     for auto-merge. `merge:watch --queue` lists it, and the merge manager
#     decides — dispatch this workflow, or land it with `merge:guard --merge`.
# No other session dispatches this workflow, runs its merge step by hand, or
# re-pins a site some other way. In a reusable workflow `github.event_name`
# is the CALLER's event, which is what this reads.
# (scripts/tests/sdlc/standing-repin-merge.test.ts runs the step's script.)

name: Standing repin

on:
  workflow_call:
    inputs:
      tools-ref:
        description: "The ref of cat-harness-tools, cat-harness and bootstrap-tools whose repin tool and schema run."
        required: false
        type: string
        default: "main"
      depth:
        description: "How many commits of a followed branch to look through for a green one."
        required: false
        type: number
        default: 30
      dry-run:
        description: "Report what would move; write, push and open nothing."
        required: false
        type: boolean
        default: false
      merge-method:
        description: "Auto-merge method: squash, merge or rebase."
        required: false
        type: string
        default: "squash"
    secrets:
      repin-token:
        description: "Optional token for the push and PR, so the site's PR checks run (see 'Why a token')."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: standing-repin-${{ github.repository }}
  cancel-in-progress: true

jobs:
  repin:
    name: Re-pin the upstreams this site follows
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: site
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.repin-token || github.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Compose the tools at ${{ inputs.tools-ref }}
        env:
          REF: ${{ inputs.tools-ref }}
        run: |
          set -euo pipefail
          mkdir tools
          for r in bootstrap bootstrap-tools cat-harness cat-harness-tools; do
            git clone -q --depth 1 --branch "$REF" "https://github.com/litlfred/$r" "tools/$r" \
              || git clone -q --depth 1 "https://github.com/litlfred/$r" "tools/$r"
          done
          cat > tools/package.json <<'JSON'
          { "name": "standing-repin-tools", "private": true, "workspaces": ["bootstrap-tools", "cat-harness", "cat-harness-tools"] }
          JSON
          (cd tools && bun install)
      - name: Re-pin
        id: repin
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
          DEPTH: ${{ inputs.depth }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          args=(--instance . --depth "$DEPTH" --summary-file "$RUNNER_TEMP/repin.md")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          # `|| code=$?`: Actions runs this as `bash -e`, so a bare call
          # followed by `code=$?` ended the step on a refusal before the
          # summary and the `code` output below were written.
          code=0
          bun ../tools/cat-harness-tools/scripts/repin-standing.ts "${args[@]}" || code=$?
          cat "$RUNNER_TEMP/repin.md" >> "$GITHUB_STEP_SUMMARY" || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # A refused or undetermined instance is a red run, and nothing is pushed:
          # a half-moved lock is not a PR (principle 4).
          exit $code
      - name: Open or update the one repin PR
        if: inputs.dry-run == false && steps.repin.outputs.moved != '0'
        working-directory: site
        env:
          GH_TOKEN: ${{ secrets.repin-token || github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          METHOD: ${{ inputs.merge-method }}
          HAS_TOKEN: ${{ secrets.repin-token != '' }}
          EVENT: ${{ github.event_name }}
          REPIN_LABEL: needs-repin
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "The repin wrote no tracked change; no PR."
            exit 0
          fi
          existing=$(gh pr list --base "$BASE" --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("repin/standing-"))][0] // empty')
          if [ -n "$existing" ]; then
            branch=$(jq -r .headRefName <<<"$existing")
            number=$(jq -r .number <<<"$existing")
          else
            branch="repin/standing-$(date -u +%Y-%m-%d)"
            number=""
          fi
          git checkout -q -B "$branch"
          git add -A
          git commit -q -F - <<EOF
          Standing repin: $(git diff --cached --name-only | tr '\n' ' ')

          $(cat "$RUNNER_TEMP/repin.md")
          EOF
          git push -q --force origin "HEAD:refs/heads/$branch"
          title="Standing repin ($(date -u +%Y-%m-%d))"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/repin.md"
          else
            gh pr create --base "$BASE" --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/repin.md"
            number=$(gh pr view "$branch" --json number --jq .number)
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # The merge manager started this run: its decision, auto-merge OK.
            gh pr merge "$number" --auto "--$METHOD" \
              || echo "::warning::auto-merge could not be enabled on #$number (is it allowed in the repository settings?)"
          else
            # Nobody decided ($EVENT): queue it for the merge manager.
            gh pr edit "$number" --add-label "$REPIN_LABEL" \
              || { echo "::error::could not label #$number \`$REPIN_LABEL\` (does the label exist here?): the merge manager would not see it"; exit 1; }
            gh pr merge "$number" --disable-auto >/dev/null 2>&1 || true
            echo "#$number labelled \`$REPIN_LABEL\` for the merge manager; no auto-merge on a $EVENT run." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::opened with GITHUB_TOKEN: the site's pull_request checks do not run on #$number, so auto-merge waits on them. Pass repin-token."
          fi
