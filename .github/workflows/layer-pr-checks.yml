# The pull-request checks every harnessed layer runs, as ONE reusable workflow.
#
# Owner, 2026-10-14 ("1"): a layer is judged on its own pull requests by one
# workflow the harness owns, called from each layer, rather than a copy per
# layer. Until then only cat-harness-tools, folio-assistant-core, who-iris and
# bootstrap-tools had pull-request CI. The rest (smart-base, smart-trust,
# smart-immunizations, fhir-harness, folio-assistant-sci, bootstrap,
# cat-harness) were judged by nothing until folio-assistant re-pinned them:
# the 2026-10-06 "defined, not run on events" ruling for the WHO forks
# switched their harness gates off with their IG builds, and the
# initialization process never installed any pull-request checks.
#
# Generalised from folio-assistant-core's `pr-checks.yml` (14ed7ad), whose
# layout is this repository's `pr-tests.yml`: check out the folio-assistant
# index, mount every instance from its `index.lock.json`, take the lower
# layers at main, and put THE CALLER (at the ref under test) in place of its
# locked mount. Three judgements:
#   - Typecheck, on the PR, when the instance carries a tsconfig.json.
#   - Tests (no new failures): the instance's tests on main and on the PR;
#     fails only on a test the PR newly breaks.
#   - Gates (no new failures): the harness's graph checks over the own
#     instance, and every `check:*` / `*:check` script of the own instance
#     AND its whole dependency harness, its transitive `needs` (owner,
#     2026-10-14: "A harnessed repo should run not just core but all of the
#     checks in the dependency harness"), on main and on the PR; fails only
#     on a gate the PR newly breaks (`run-gates.py`).
#
# Two modes, because a harnessed repository is one of two shapes:
#   - `layer`: a layer the folio-assistant index mounts (cat-harness,
#     smart-base, ...). The index is checked out and the caller swapped in.
#   - `index`: a repository that is its own index (an IG repository over
#     smart-base, smart-ra, a folio): the caller IS the root, mounted from its
#     own `index.lock.json`, and its own instance is the one it declares at
#     its root, or, when it declares none, every instance it mounts.
# A gate or test already red on main is listed in the step summary, never
# hidden and never counted against the PR.
#
# A caller is the one `uses:` line and nothing else (owner, 2026-10-14:
# "there shouldnt be copying of code"):
#
#   on: { pull_request: {}, workflow_dispatch: {} }
#   permissions: { contents: read }
#   jobs:
#     checks:
#       uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
#
# Everything every caller would otherwise repeat is decided here: the instance
# is the calling repository's name, the folio-assistant ref is `index-ref`'s
# default, the judging scripts are at main, and one run per PR is kept
# (`concurrency`, below). A caller passes an input only when it genuinely
# differs from that: smart-base's `path-in-repo: smart-base` (its instance is
# a sub-directory), a `layers-at-main` the dependencies do not imply, or
# `with: { mode: index }` for a repository that is its own index.

name: Layer PR checks

on:
  workflow_call:
    inputs:
      mode:
        description: "'layer' (mounted by the folio-assistant index) or 'index' (the caller is its own index)."
        required: false
        type: string
        default: "layer"
      instance:
        description: "layer mode: the instance's directory in the folio-assistant index (its mount path); empty means the calling repository's name. index mode: optional."
        required: false
        type: string
        default: ""
      test-path:
        description: "What `bun test` runs, from the root; empty means the instance's directory (layer) or no tests (index)."
        required: false
        type: string
        default: ""
      gate-jobs:
        description: "Gates run at once (the dependency harness is ~300 gates)."
        required: false
        type: number
        default: 1
      path-in-repo:
        description: "Where the instance sits in the calling repository; '.' for the repository root."
        required: false
        type: string
        default: "."
      layers-at-main:
        description: "Lower layers taken at main instead of the lock (the caller is never replaced). 'auto': the instance's @litlfred/* dependencies, which it imports by package name and whose main it tracks."
        required: false
        type: string
        default: "auto"
      state-graphs:
        description: "Branch-kept graphs to mount before tests and gates; each must come back mounted."
        required: false
        type: string
        default: "beans todos fsh-guts"
      index-ref:
        description: "layer mode: the folio-assistant ref to check out (main, or a re-pin branch while main's pins are behind)."
        required: false
        type: string
        # It was "claude/nifty-johnson-w3mspn" while folio-assistant main pinned
        # pre-70lx layers; folio-assistant#2529 merged on 2026-10-15.
        default: "main"
      tools-ref:
        description: "The cat-harness-tools ref whose judging scripts run (both sides use the same)."
        required: false
        type: string
        default: "main"

permissions:
  contents: read

# One run per PR (or ref), the newest. The group is this workflow's own, so it
# never collides with a group a caller may still declare.
concurrency:
  group: layer-pr-checks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

# The instance, once: the input when given, else (layer mode) the calling
# repository's name, which is the instance's name for every layer.
env:
  INSTANCE: ${{ inputs.instance != '' && inputs.instance || (inputs.mode == 'layer' && github.event.repository.name || '') }}

jobs:
  # The folio-assistant commit every job checks out, resolved ONCE per run.
  #
  # `index-ref` names a branch, and a branch moves. Each job used to check it
  # out when it started, so whenever the index was re-pinned while a run was
  # queued, base and head mounted DIFFERENT layer pins and the compare job
  # charged the difference to the PR. fhir-harness#86, run 38695852469: head
  # checked out claude/nifty-johnson-w3mspn at 07:01:56Z (a3fa2e5), the branch
  # moved to 725d8f8 at 07:04:45Z, base checked out at 07:08Z, and
  # `render:bpmn:check`, red at the first pins and green at the second, was
  # reported as a NEW FAILURE of a PR that touched no diagram. One sha, read
  # here and passed to both sides, makes the two sides judge the same index.
  # Index mode needs none of this: the caller IS the root, at the PR's merge
  # commit.
  pin:
    name: Resolve the index commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          MODE: ${{ inputs.mode }}
          REF: ${{ inputs.index-ref }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "index" ]; then
            echo "index mode: the caller is the root; nothing to resolve"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$REF"
          else
            # A branch, else an annotated tag's commit, else a light tag.
            refs="$(git ls-remote https://github.com/litlfred/folio-assistant.git "refs/heads/$REF" "refs/tags/$REF" "refs/tags/$REF^{}")"
            sha="$(printf '%s\n' "$refs" | awk -v r="refs/heads/$REF" '$2 == r { print $1 }')"
            [ -n "$sha" ] || sha="$(printf '%s\n' "$refs" | awk -v r="refs/tags/$REF^{}" '$2 == r { print $1 }')"
            [ -n "$sha" ] || sha="$(printf '%s\n' "$refs" | awk -v r="refs/tags/$REF" '$2 == r { print $1 }')"
          fi
          if [ -z "$sha" ]; then
            echo "::error::index-ref '$REF' names no branch or tag of litlfred/folio-assistant"
            exit 2
          fi
          echo "index-ref $REF is $sha for every job of this run"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - &checkout-index
        name: Check out the root (the folio-assistant index, or the caller in index mode)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.mode == 'index' && github.repository || 'litlfred/folio-assistant' }}
          # Index mode: the PR's merge commit on both sides; the base side then
          # steps to its first parent (below). Never `pull_request.base.sha`:
          # it is the base as of the PR's last push, older than the main the
          # merge commit holds whenever main moved since, so head-vs-base would
          # charge main's own changes to the PR (seen on smart-base#57, where
          # smart-base#53 landed between).
          # `github.ref`, never `''`: an expression's `a && '' || b` is `b`,
          # because `''` is falsy, so index mode checked out the caller's
          # `index-ref` default, `main`, and judged main against its own
          # first parent instead of the PR (smart-immunizations#35, run
          # 38633852296: `-B main refs/remotes/origin/main`).
          # Layer mode: the one commit the `pin` job resolved `index-ref` to,
          # never the ref itself, so base and head mount the same pins.
          ref: ${{ inputs.mode == 'index' && github.ref || needs.pin.outputs.sha }}
          fetch-depth: ${{ inputs.mode == 'index' && 2 || 1 }}
          path: fa
      - &setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - &mount
        # A root that carries its own replayer (folio-assistant's
        # `.github/mount-from-lock.sh`) is mounted with it: it knows which
        # layer held the replayer at the commit its lock pins. Otherwise the
        # replayer is `mount-from-lock.ts` at the commit the root's lock pins
        # (cat-harness-tools, or cat-harness before the code moved, bean
        # 70lx); it imports only node:*, so that one file is enough, as
        # who-iris's checks.yml does.
        name: Mount every instance from the root's lock
        run: |
          set -euo pipefail
          if [ -f fa/.github/mount-from-lock.sh ]; then
            bash fa/.github/mount-from-lock.sh --root fa
            exit 0
          fi
          work="$(mktemp -d)"
          git -C "$work" init -q
          for layer in cat-harness-tools cat-harness; do
            read -r repo sha < <(bun -e '
              const l = JSON.parse(require("node:fs").readFileSync("fa/index.lock.json", "utf-8"));
              const i = (l.instances ?? []).find((x) => x.instance === process.argv[1]);
              console.log(i ? `${i.repository} ${i.sha}` : "- -");
            ' "$layer")
            [ "$repo" = "-" ] && continue
            git -C "$work" fetch -q --depth 1 --filter=blob:none "https://github.com/${repo}.git" "$sha"
            if git -C "$work" checkout -q FETCH_HEAD -- scripts/mount-from-lock.ts 2>/dev/null; then
              bun "$work/scripts/mount-from-lock.ts" --root fa
              exit 0
            fi
          done
          echo "::error::no mount-from-lock replayer at the cat-harness-tools or cat-harness commit fa/index.lock.json pins"
          exit 2
      - name: Check out the PR
        if: inputs.mode == 'layer'
        uses: actions/checkout@v4
        with:
          path: src
      - &lower-layers-main
        name: Take the lower layers at main
        env:
          LAYERS: ${{ inputs.layers-at-main }}
          MODE: ${{ inputs.mode }}
          SUBDIR: ${{ inputs.path-in-repo }}
        run: |
          set -euo pipefail
          if [ "$LAYERS" = "auto" ]; then
            # The PR's own package.json in layer mode: its imports are what
            # it is judged against, and the locked copy may predate them.
            pkg="fa/package.json"
            [ "$MODE" = "layer" ] && pkg="src/${SUBDIR:-.}/package.json"
            LAYERS="$(python3 - "$pkg" <<'PY'
          import json, sys
          try:
              p = json.load(open(sys.argv[1]))
          except FileNotFoundError:
              p = {}
          deps = {**p.get("dependencies", {}), **p.get("devDependencies", {}), **p.get("peerDependencies", {})}
          print(" ".join(sorted(d.split("/", 1)[1] for d in deps if d.startswith("@litlfred/"))))
          PY
          )"
            echo "lower layers at main (from @litlfred/* dependencies): ${LAYERS:-none}"
          fi
          for r in $LAYERS; do
            [ "$r" = "$INSTANCE" ] && continue
            rm -rf "fa/$r"
            git clone -q --depth 1 "https://github.com/litlfred/$r" "fa/$r"
            rm -rf "fa/$r/.git"
          done
      - &swap
        # A directory holding its own `.git` inside the index checkout is a
        # FOREIGN checkout to `instanceRootsIn`, so it would not be discovered
        # as an instance. Lock mounts carry no `.git`; the swapped-in copy is
        # made to look the same.
        name: Put the caller in place of its locked mount
        if: inputs.mode == 'layer'
        env:
          SUBDIR: ${{ inputs.path-in-repo }}
        run: |
          set -euo pipefail
          rm -rf "fa/$INSTANCE"
          if [ "$SUBDIR" = "." ]; then mv src "fa/$INSTANCE"; else mv "src/$SUBDIR" "fa/$INSTANCE"; fi
          rm -rf "fa/$INSTANCE/.git"
          test -f "fa/$INSTANCE/$INSTANCE.json" || { echo "::error::fa/$INSTANCE/$INSTANCE.json is missing: is path-in-repo right?"; exit 2; }
      - &install
        name: Install
        working-directory: fa
        run: bun install
      - name: tsc --noEmit
        working-directory: fa/${{ inputs.mode == 'layer' && env.INSTANCE || '.' }}
        run: |
          if [ -f tsconfig.json ]; then bunx tsc --noEmit -p tsconfig.json; else echo "no tsconfig.json: nothing to typecheck"; fi

  run:
    name: ${{ matrix.side }} — tests and gates
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    steps:
      - *checkout-index
      - name: Base side of the root (index mode)
        if: inputs.mode == 'index' && matrix.side == 'base'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DIR: fa
        run: |
          # A PR's merge commit: its first parent is the main it merges into,
          # exactly. Anything else (workflow_dispatch): the default branch's tip.
          set -euo pipefail
          cd "$DIR"
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git checkout -q --detach 'HEAD^1'
          else
            git fetch -q --depth 1 origin "$DEFAULT_BRANCH"
            git checkout -q --detach FETCH_HEAD
          fi
          git log -1 --format='base side: %h %s'
      - *setup-bun
      - *mount
      - name: Check out the caller
        if: inputs.mode == 'layer'
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 2
      - name: Base side of the caller
        if: inputs.mode == 'layer' && matrix.side == 'base'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DIR: src
        run: |
          # A PR's merge commit: its first parent is the main it merges into,
          # exactly. Anything else (workflow_dispatch): the default branch's tip.
          set -euo pipefail
          cd "$DIR"
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git checkout -q --detach 'HEAD^1'
          else
            git fetch -q --depth 1 origin "$DEFAULT_BRANCH"
            git checkout -q --detach FETCH_HEAD
          fi
          git log -1 --format='base side: %h %s'
      - *lower-layers-main
      - name: The judging scripts, the same on both sides
        uses: actions/checkout@v4
        with:
          repository: litlfred/cat-harness-tools
          ref: ${{ inputs.tools-ref }}
          path: ci
          sparse-checkout: .github/scripts/layer-pr-checks
      - *swap
      - name: Give the root the `cat` script the harness's commands assume
        # The harness's scripts spawn `bun run cat <name>` from the root
        # (qa:refresh, kg:detangle, regen, ...). A root without that entry
        # (smart-ra) ran /usr/bin/cat instead (smart-ra#65: "/usr/bin/cat:
        # 'qa:refresh': No such file or directory"). Added to the working copy
        # only, the same on base and head; a root that has one keeps it.
        run: python3 ci/.github/scripts/layer-pr-checks/root-cat-script.py fa
      - *install
      - name: Install Chromium, for the checks that draw through a browser
        # `render:bpmn` and the `*:processes:render:check` gates draw BPMN with
        # bpmn-js in Chromium (folio-assistant's B1 test job installs it for
        # the same reason). The index's OWN Playwright installs it, so the
        # browser build is the one that Playwright expects: a bare `npx
        # playwright` may fetch another (smart-base#57: "Executable doesn't
        # exist at .../chromium_headless_shell-1243").
        working-directory: fa
        run: |
          if [ -x node_modules/.bin/playwright ]; then
            node_modules/.bin/playwright install --with-deps chromium
          else
            echo "no playwright in the index: no browser installed"
          fi
      - name: Mount every graph kept on a branch, and build the IG pages
        # Every branch-kept graph the declarations name (beans, todos,
        # fsh-guts, health, issue-marks, marks, ...), as the index's own CI
        # mounts them with `state:mount`, but through `mountState` directly:
        # `state:mount` also re-lays the remote mounts against the lock, which
        # would refuse the swapped-in caller. Then the IG instances' pages,
        # which are built rather than committed (bean hupw); several gates
        # read them (owner's session 01Pc8v, 2026-10-14: declaration-resolution
        # was red only because neither was done).
        working-directory: fa
        run: |
          set -euo pipefail
          bun -e '
            import { mountState, report } from "./cat-harness-tools/scripts/state-mount.ts";
            const r = mountState({});
            console.log(report(r));
            // Not fatal: both sides mount the same branches, so a graph that
            // will not mount reads the same on base and head, and the compare
            // job judges what the PR changed. Dying here judged nothing
            // (smart-ra#59: issue-marks has no branch on that remote).
            if (r.state === "failed" || r.state === "partial")
              console.log("::warning::state mount " + r.state + ": see the report above; the gates that read those graphs see them unmounted on both sides");
          '
          if python3 -c 'import json,sys; sys.exit(0 if "smart:pages" in json.load(open("package.json")).get("scripts", {}) else 1)'; then
            bun run cat smart:pages
          fi
      - name: Build the publish-time pages (derive:publish), on this side
        # B1 (owner, 2026-10-14; cat-harness#194, cb280cd): the pages an
        # instance declares `builtAtPublish` are no longer committed, and
        # `bun run cat derive:publish` builds them over the mounts, as
        # folio-assistant's `publish-pages` job does before its tests. Gates
        # and tests read them (docs/_data/harness.json, avatars.css, the UML
        # overview, the translated glossary), so without this every caller
        # re-pinned past cb280cd went newly red on head while base, at the
        # older pins, still had them committed (smart-ra#66, run 38690096973).
        # It runs on BOTH sides, after state mount (its `state` writers read
        # the branch-kept graphs) and after the Chromium install (render:bpmn).
        #
        # Never fatal: the gates run whatever happened here. The outcome is
        # recorded as the gate `publish:derive:publish` (run-gates.py
        # `--record`), so the compare job reports a head failure as NEW and
        # one red on main too as such, rather than it vanishing in this log.
        #
        # A root with no `cat` script (smart-ra) is given one for this step
        # only: derive:publish and its writers call `bun run cat <writer>`,
        # which there would run /usr/bin/cat. package.json is restored before
        # the tests and gates, so they judge the checkout as committed.
        working-directory: fa
        run: |
          set -uo pipefail
          rec="$RUNNER_TEMP/derive-publish.json"
          log="$RUNNER_TEMP/derive-publish.log"
          runner="bun cat-harness-tools/scripts/run-script.ts"
          if [ ! -f cat-harness-tools/scripts/run-script.ts ]; then
            why="cat-harness-tools/scripts/run-script.ts is absent at this side's pin"
          elif ! { $runner --list 2>/dev/null || true; } | cut -f1 | grep -x 'derive:publish' >/dev/null; then
            why="no instance declares derive:publish at this side's pins (its pages are committed there)"
          else
            why=""
          fi
          if [ -n "$why" ]; then
            echo "derive:publish skipped: $why"
            python3 - "$rec" "$why" <<'PY'
          import json, sys
          json.dump({"publish:derive:publish": {"command": "bun run cat derive:publish", "skipped": sys.argv[2]}}, open(sys.argv[1], "w"), indent=1)
          PY
            exit 0
          fi
          injected=""
          if ! python3 -c 'import json,sys; sys.exit(0 if "cat" in json.load(open("package.json")).get("scripts", {}) else 1)'; then
            cp package.json "$RUNNER_TEMP/package.json.orig"
            python3 - <<'PY'
          import json
          p = json.load(open("package.json"))
          p.setdefault("scripts", {})["cat"] = "bun cat-harness-tools/scripts/run-script.ts"
          json.dump(p, open("package.json", "w"), indent=2)
          PY
            injected=1
            echo "root has no \`cat\` script: one is added for derive:publish and removed after it"
          fi
          # GitHub runs this step as `bash -e`, and pipefail is set above, so a
          # failing build would end the step at this pipeline before the
          # recording below (smart-ra#66, job 116366855337). `|| code=$?` keeps
          # the step alive with derive:publish's own exit (tee's is 0).
          code=0
          bun run cat derive:publish 2>&1 | tee "$log" || code=$?
          if [ -n "$injected" ]; then cp "$RUNNER_TEMP/package.json.orig" package.json; fi
          # A root that is not the folio-assistant index (no
          # code-quality-gates.yml: a folio, an IG repository) mounts fewer
          # instances than cat-harness's builtAtPublish list assumes (smart-ra#66:
          # smart:pages, beans, glossaries of unmounted instances), so a failed
          # build there is recorded as SKIPPED with its tail, not judged: the
          # pages it did build still serve the gates that read them. In the index
          # it stays a gate, so the index's own build is held to every writer.
          if [ "$code" -ne 0 ] && [ ! -f .github/workflows/code-quality-gates.yml ]; then
            echo "::warning::derive:publish exited $code on the ${{ matrix.side }} side of a root that is not the index; recorded as skipped, not judged"
            python3 - "$rec" "$code" "$log" <<'PY'
          import json, sys
          tail = open(sys.argv[3], errors="replace").read().strip()[-600:].replace("\n", " / ")
          json.dump({"publish:derive:publish": {"command": "bun run cat derive:publish", "skipped": f"exited {sys.argv[2]} in a root that is not the index: {tail}"}}, open(sys.argv[1], "w"), indent=1)
          PY
          else
            if [ "$code" -ne 0 ]; then
              echo "::error::derive:publish exited $code on the ${{ matrix.side }} side; the gates still run, and the compare job judges it as the gate publish:derive:publish"
            fi
            python3 - "$rec" "$code" "$log" <<'PY'
          import json, sys
          tail = open(sys.argv[3], errors="replace").read().strip()[-1500:]
          json.dump({"publish:derive:publish": {"command": "bun run cat derive:publish", "exit": int(sys.argv[2]), "tail": tail}}, open(sys.argv[1], "w"), indent=1)
          PY
          fi
      - name: bun test
        working-directory: fa
        # Judged by the compare job, not by this exit code.
        env:
          TEST_PATH: ${{ inputs.test-path != '' && inputs.test-path || (inputs.mode == 'layer' && format('./{0}', env.INSTANCE) || '') }}
        run: |
          if [ -z "$TEST_PATH" ]; then
            echo "no test-path in index mode: no tests run"
            echo '<?xml version="1.0"?><testsuites tests="0" failures="0"></testsuites>' > "$RUNNER_TEMP/junit.xml"
          else
            # shellcheck disable=SC2086 -- TEST_PATH may name several paths
            bun test $TEST_PATH --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit.xml" || true
            # A layer with no test files (bootstrap: prose and schemas) makes
            # bun exit before writing a report. That is zero tests, not a
            # failure, and the compare job reads it as such on both sides.
            if [ ! -s "$RUNNER_TEMP/junit.xml" ]; then
              echo "no test files under $TEST_PATH: no tests run"
              echo '<?xml version="1.0"?><testsuites tests="0" failures="0"></testsuites>' > "$RUNNER_TEMP/junit.xml"
            fi
          fi
          test -s "$RUNNER_TEMP/junit.xml"
      - name: Gates
        # Judged by the compare job, not by this exit code.
        #
        # The inputs gates take from this run (run-gates.py SUPPLIED_INPUTS):
        #   GATE_JUNIT     the report the tests step above wrote, for
        #                  check:test-budgets.
        #   GATE_DIFF_BASE the commit the PR's diff starts from, for
        #                  check:corpus-gate --since. Index mode only: the root
        #                  IS the caller, a merge commit fetched at depth 2. On
        #                  head it is the merge's first parent, so the gate
        #                  judges exactly what the PR adds; on base it is base
        #                  itself, so main is judged on nothing it did not
        #                  already hold. Layer mode leaves it unset: the root is
        #                  the folio-assistant index and the caller was swapped
        #                  in without its .git, so the gate is skipped with that
        #                  reason rather than judging folio-assistant's history.
        env:
          GATE_JOBS: ${{ inputs.gate-jobs }}
          OWN: ${{ env.INSTANCE != '' && format('--instance {0}', env.INSTANCE) || '' }}
          MODE: ${{ inputs.mode }}
          SIDE: ${{ matrix.side }}
        # shellcheck disable=SC2086 -- OWN is empty or one flag and its value
        run: |
          set -euo pipefail
          export GATE_JUNIT="$RUNNER_TEMP/junit.xml"
          GATE_DIFF_BASE=""
          if [ "$MODE" = "index" ]; then
            if [ "$SIDE" = "head" ] && git -C fa rev-parse -q --verify 'HEAD^2' >/dev/null; then
              GATE_DIFF_BASE="$(git -C fa rev-parse 'HEAD^1')"
            else
              GATE_DIFF_BASE="$(git -C fa rev-parse HEAD)"
            fi
            echo "corpus-gate diff base ($SIDE): $GATE_DIFF_BASE"
          fi
          export GATE_DIFF_BASE
          python3 ci/.github/scripts/layer-pr-checks/run-gates.py fa "$RUNNER_TEMP/gates.json" $OWN --record "$RUNNER_TEMP/derive-publish.json"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.side }}
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/gates.json

  compare:
    name: No new failures (tests and gates)
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: litlfred/cat-harness-tools
          ref: ${{ inputs.tools-ref }}
          sparse-checkout: .github/scripts/layer-pr-checks
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Tests
        id: tests
        continue-on-error: true
        run: python3 .github/scripts/layer-pr-checks/compare-test-failures.py results/results-base/junit.xml results/results-head/junit.xml
      - name: Gates
        id: gates
        continue-on-error: true
        run: python3 .github/scripts/layer-pr-checks/compare-gates.py results/results-base/gates.json results/results-head/gates.json
      - name: Verdict
        if: steps.tests.outcome != 'success' || steps.gates.outcome != 'success'
        run: |
          echo "::error::tests: ${{ steps.tests.outcome }}, gates: ${{ steps.gates.outcome }} — see the step summary"
          exit 1
