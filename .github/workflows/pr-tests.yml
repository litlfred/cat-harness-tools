# PR checks for cat-harness-tools (issue #32).
#
# This repository's tests run inside the folio-assistant index, where the other
# instances are mounted beside it: most of them read the index's workflows,
# `bootstrap/`, the content instances' directories and so on. So each run checks out folio-assistant
# main, mounts every instance from its `index.lock.json`, then puts this
# repository (at the ref under test) and cat-harness main in place of their
# locked mounts, since this repository's main tracks cat-harness main. Their
# `.git` directories are removed so they are discovered as instances, the
# same as a lock mount.
#
# Many tests already fail on main. Rather than skipping them, the `tests` job
# runs the whole suite twice, on main and on the PR, and fails only on tests the
# PR newly breaks. The step summary lists every failure, old and new.
#
# NO E2E JOB, and why (bean cat-tools-g9m3, Done-when 3). The Playwright suite
# (`bun run cat test:e2e`, 83 `*.e2e.ts` specs under `test/` on 2026-10-12) cannot be run
# meaningfully against this mount yet: with the paths fixed (#65), collection
# still stops at a spec that throws "no instance named <catalogue instance>
# declares a visualiser catalogue", because the instance that declares the
# visualiser catalogue the spec needs is pinned, in folio-assistant's
# `index.lock.json`, at a commit that predates that visualiser. A job here would report 0 specs,
# which reads as a pass and is the 1xhc shape this repository keeps paying for.
# The job belongs here once that instance is re-pinned (lane A, bean kpci) --
# or in the index's CI, which mounts every layer: then add
# a job that fails when `playwright test --list` collects fewer than the specs
# on disk, and runs them.

name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    # Every job stands on the SAME cat-harness and index commits, read once
    # here. Cloned per job, `main` moved between the base and head jobs (minutes
    # apart), and the comparison charged that move to the PR: ingest-and-l1's
    # verdicts flipped "new failure" / "fixed by this PR" with the corpus's
    # timing (cat-harness-tools#217, #223).
    name: Pin cat-harness and the index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cat-harness: ${{ steps.pin.outputs.cat-harness }}
      index: ${{ steps.pin.outputs.index }}
    steps:
      - id: pin
        run: |
          set -euo pipefail
          echo "cat-harness=$(git ls-remote https://github.com/litlfred/cat-harness refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "index=$(git ls-remote https://github.com/litlfred/folio-assistant refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - &checkout-index
        name: Check out the folio-assistant index
        uses: actions/checkout@v4
        with:
          repository: litlfred/folio-assistant
          ref: ${{ needs.pin.outputs.index }}
          path: fa
      - &setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - &mount
        name: Mount every instance from the index lock
        run: bash fa/.github/mount-from-lock.sh --root fa
      - &cat-harness-main
        name: Use cat-harness main, at the pinned commit
        env:
          SHA: ${{ needs.pin.outputs.cat-harness }}
        run: |
          set -euo pipefail
          rm -rf fa/cat-harness
          git init -q fa/cat-harness
          git -C fa/cat-harness fetch -q --depth 1 https://github.com/litlfred/cat-harness "$SHA"
          git -C fa/cat-harness checkout -q --detach FETCH_HEAD
          rm -rf fa/cat-harness/.git
      - name: Put the PR in place of the locked cat-harness-tools
        run: rm -rf fa/cat-harness-tools
      - uses: actions/checkout@v4
        with:
          path: fa/cat-harness-tools
      - &unnest
        # A directory holding its own `.git` inside the index checkout is a
        # FOREIGN checkout to `instanceRootsIn` (cat-harness
        # schemas/instance-roots.ts), so it is not discovered as an instance
        # and its scripts drop out of the script table. Lock mounts carry no
        # `.git`; make these two look the same.
        name: Make the swapped-in checkouts plain mounts
        run: rm -rf fa/cat-harness-tools/.git fa/cat-harness/.git
      - &install
        name: Install
        working-directory: fa
        run: bun install
      - name: tsc --noEmit
        working-directory: fa/cat-harness-tools
        run: bunx tsc --noEmit -p tsconfig.json

  run-tests:
    name: bun test (${{ matrix.side }})
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    steps:
      - *checkout-index
      - *setup-bun
      - *mount
      - *cat-harness-main
      - name: Put cat-harness-tools in place of the locked mount
        run: rm -rf fa/cat-harness-tools
      - uses: actions/checkout@v4
        with:
          path: fa/cat-harness-tools
          fetch-depth: 2
      - &base-side
        # Both sides check out the PR's merge commit; the base side steps to its
        # first parent, the main it merges into. Never `pull_request.base.sha`:
        # that is main as of the PR's last push, older than the main the merge
        # commit holds whenever main moved since. workflow_dispatch: main's tip.
        name: Base side, the merge commit's first parent
        if: matrix.side == 'base'
        working-directory: fa/cat-harness-tools
        run: |
          set -euo pipefail
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            git checkout -q --detach 'HEAD^1'
          else
            git fetch -q --depth 1 origin main
            git checkout -q --detach FETCH_HEAD
          fi
          git log -1 --format='base side: %h %s'
      - *unnest
      - *install
      - name: Mount the graphs kept on branches
        # beans, todos and fsh-guts live on `cat/cat-harness/<id>` branches,
        # not on main, as in the index's own CI (`state:mount`). Many tests read
        # them and refuse an unmounted copy. Mounted one id at a time with
        # --json, which skips the tools-graph report that fails on lock skew,
        # and each must come back `mounted`.
        working-directory: fa
        run: |
          for id in beans todos fsh-guts; do
            bun cat-harness-tools/scripts/state-mount.ts --id "$id" --json > "$RUNNER_TEMP/mount-$id.json"
            python3 - "$RUNNER_TEMP/mount-$id.json" "$id" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          bad = [g for g in d.get("graphs", []) if g.get("state") != "mounted"]
          if d.get("state") != "mounted" or bad or not d.get("graphs"):
              print(f"::error::{sys.argv[2]} did not mount: {json.dumps(d)}")
              sys.exit(1)
          print(f"{sys.argv[2]}: mounted")
          PY
          done
      - name: bun test
        working-directory: fa
        # The result is judged by the compare job, not by this exit code.
        run: |
          bun test ./cat-harness-tools --reporter=junit --reporter-outfile="$RUNNER_TEMP/junit.xml" || true
          test -s "$RUNNER_TEMP/junit.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.side }}
          path: ${{ runner.temp }}/junit.xml

  standalone-run:
    # The standalone ratchet (bean `ho66`; owner, 2026-10-14). The tracked
    # files of this layer and of its declared closure (`needs`: cat-harness,
    # bootstrap-tools) are laid out as sibling git repositories with no index
    # around them, and `bun test` is run in this layer. A test that fails there
    # reads something only the monorepo has. Measured on BOTH main and the PR,
    # like run-tests: both stand on cat-harness main, which moves, so a test
    # that starts failing on main because cat-harness changed is not this PR's.
    # The `standalone` job below judges the pair against the committed
    # `scripts/standalone-baseline.json`. The baseline is measured in THIS
    # layout (the index mounts, cat-harness main, bun 1.3.14) with no state
    # graphs mounted: a mount is the monorepo's, and the rehearsal copies only
    # the closure anyway.
    name: standalone (${{ matrix.side }})
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
    steps:
      - *checkout-index
      - *setup-bun
      - *mount
      - *cat-harness-main
      - name: Put cat-harness-tools in place of the locked mount
        run: rm -rf fa/cat-harness-tools
      - uses: actions/checkout@v4
        with:
          path: fa/cat-harness-tools
          fetch-depth: 2
      - *base-side
      - name: Measure with the PR's checker on both sides
        # So a main that predates --measured-out is still measured. Only the
        # checker file is taken from the PR; the tree it measures is main's.
        if: matrix.side == 'base'
        uses: actions/checkout@v4
        with:
          path: pr-checker
          sparse-checkout: scripts/check-standalone.ts
          sparse-checkout-cone-mode: false
      - if: matrix.side == 'base'
        run: cp pr-checker/scripts/check-standalone.ts fa/cat-harness-tools/scripts/check-standalone.ts && rm -rf pr-checker
      - *unnest
      - *install
      - name: Measure cat-harness-tools standalone
        working-directory: fa
        # Called directly, not through `bun run cat`: folio-assistant's root
        # `cat` alias points at cat-harness/scripts/run-script.ts, which has
        # moved to this repository. The result is judged by the standalone job,
        # not by this exit code; a side that could not be measured is judged
        # as such (head) or leaves the baseline alone to judge (base).
        run: |
          bun run cat-harness-tools/scripts/check-standalone.ts --layer cat-harness-tools --measured-out "$RUNNER_TEMP/standalone.json" || true
          test -s "$RUNNER_TEMP/standalone.json" || echo '{"state":"not-run","note":"this side wrote no measurement"}' > "$RUNNER_TEMP/standalone.json"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.side }}
          path: ${{ runner.temp }}/standalone.json

  standalone:
    name: Standalone (no new failures)
    needs: standalone-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            scripts/standalone-baseline.json
      - uses: actions/download-artifact@v4
        with:
          path: standalone
      - name: Judge the PR against main and the baseline
        run: >-
          python3 .github/scripts/compare-standalone.py scripts/standalone-baseline.json cat-harness-tools
          standalone/standalone-base/standalone.json standalone/standalone-head/standalone.json

  tests:
    name: Tests (no new failures)
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          path: junit
      - name: Compare PR failures with main
        run: python3 .github/scripts/compare-test-failures.py junit/junit-base/junit.xml junit/junit-head/junit.xml
