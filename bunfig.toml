# Bun configuration for cat-harness-tools run on its own, from this directory.
# A composed checkout's root `bunfig.toml` is not read from here.
#
# The two schema test preloads, which came here with the schemas from
# cat-harness (bean `8lcl`). `test-fixture-preload.ts` first, because it must
# set FOLIO_FIXTURE_CHECKOUT before the registry `test-preload.ts` imports
# scans at load.
[test]
preload = ["./schemas/test-fixture-preload.ts", "./schemas/test-preload.ts"]
